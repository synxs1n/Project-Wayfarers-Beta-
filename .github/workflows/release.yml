name: Build and release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['RELEASE_VERSION']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh build.sh
      - run: git diff --stat || true
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: sh build.sh
      - run: npm install --omit=dev
      - name: Stage web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/icons
      - run: npx cap add android
      - name: Google sign in setup (stable signing key, Firebase config, gradle plugin)
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore
          cp android-google-services.json android/app/google-services.json
          python3 - <<'PY'
          import re
          p='android/variables.gradle';v=open(p).read()
          if 'rgcfaIncludeGoogle' not in v:
              v=v.replace('ext {','ext {\n    rgcfaIncludeGoogle = true',1)
              open(p,'w').write(v)
          p='android/build.gradle';s=open(p).read()
          if 'google-services' not in s:
              s=re.sub(r"(dependencies\s*\{)",r"\1\n        classpath 'com.google.gms:google-services:4.4.2'",s,count=1)
              open(p,'w').write(s)
          p='android/app/build.gradle';s=open(p).read()
          if 'com.google.gms.google-services' not in s:
              s+="\napply plugin: 'com.google.gms.google-services'\n"
          if 'android-debug.keystore' not in s:
              s=s.replace("android {","android {\n    signingConfigs.debug {\n        storeFile file(\"${rootDir}/../android-debug.keystore\")\n        storePassword 'android'\n        keyAlias 'androiddebugkey'\n        keyPassword 'android'\n    }",1)
          open(p,'w').write(s)
          PY
      - name: App icons
        run: |
          R=android/app/src/main/res
          rm -f $R/drawable-v24/ic_launcher_foreground.xml $R/drawable/ic_launcher_background.xml
          rm -f $R/mipmap-*/ic_launcher*.png $R/mipmap-*/ic_launcher*.xml
          cp -r android-res/* $R/
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Wayfarers-android.apk
      - name: Show signing fingerprint
        run: keytool -printcert -jarfile Wayfarers-android.apk | grep SHA1
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: Wayfarers-android.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "tag=$(head -1 RELEASE_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Wayfarers (latest build)
          make_latest: true
          files: files/*
